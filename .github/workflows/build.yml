name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Releases are published from a Mac with Scripts/release-notarized.sh (notarized, under the
# maintainer's own account); CI only tests and builds.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: xcodebuild -version && swift --version

      - name: Test
        run: swift test

      - name: Build app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || VERSION="0.0.0-dev"
          UNIVERSAL=1 INSTALL=0 ZIP=1 VERSION="$VERSION" BUILD="$GITHUB_RUN_NUMBER" Scripts/build-app.sh

      - uses: actions/upload-artifact@v7
        with:
          name: Docklane
          path: dist/Docklane.zip
