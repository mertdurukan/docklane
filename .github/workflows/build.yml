name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: xcodebuild -version && swift --version

      - name: Test
        run: swift test

      - name: Build app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || VERSION="0.0.0-dev"
          UNIVERSAL=1 INSTALL=0 ZIP=1 VERSION="$VERSION" BUILD="$GITHUB_RUN_NUMBER" Scripts/build-app.sh

      - uses: actions/upload-artifact@v7
        with:
          name: Docklane
          path: dist/Docklane.zip

      # A version tag publishes a GitHub release with the zip and that version's changelog section.
      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && (/^## \[/ || /^\[/) { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          cat docs/release-install.md >> notes.md
          gh release create "$GITHUB_REF_NAME" dist/Docklane.zip --title "Docklane $VERSION" --notes-file notes.md
