name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Releases are published from a Mac with Scripts/release-notarized.sh (notarized, under the
# maintainer's own account); CI only tests and builds.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Commits are authored by the maintainer alone: no AI co-author or "generated with"
      # lines anywhere in the history (the same rule as the local commit-msg hook).
      - name: Attribution
        run: |
          if git log --format=%B | grep -inE '^(co-authored-by|signed-off-by):.*(claude|anthropic)|generated with .*claude'; then
            echo "Remove the attribution lines above from the commit messages." >&2
            exit 1
          fi

      - name: Toolchain
        run: xcodebuild -version && swift --version

      - name: Test
        run: swift test

      - name: Build app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || VERSION="0.0.0-dev"
          UNIVERSAL=1 INSTALL=0 ZIP=1 VERSION="$VERSION" BUILD="$GITHUB_RUN_NUMBER" Scripts/build-app.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Docklane
          path: dist/Docklane.zip
